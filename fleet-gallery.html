<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stellar Clash — Fleet Atelier</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101923;color:#e7eef3;font:14px/1.5 system-ui,Arial,sans-serif}#scene{position:absolute;inset:0}canvas{display:block}header{position:absolute;top:24px;left:32px;right:32px;z-index:2;display:flex;justify-content:space-between;gap:24px;pointer-events:none}header>*{pointer-events:auto}h1{font-size:20px;letter-spacing:2px;font-weight:600;margin:0}header p{margin:4px 0 0;color:#a5b6c6;letter-spacing:.5px;font-size:13px}.controls{background:#111e2aeb;border:1px solid #3b5264;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;max-width:65vw}select,button{border:1px solid #526b7e;background:#253949;color:#edf7ff;border-radius:6px;font:inherit;padding:10px;min-height:44px}select{max-width:260px}button{cursor:pointer}button:hover{background:#355365}button:focus-visible,select:focus-visible{outline:2px solid #a6e6fd;outline-offset:3px}.caption{position:absolute;bottom:28px;left:32px;right:32px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:24px;pointer-events:none}.caption p{max-width:480px;color:#aebdca;font-size:14px;margin:8px 0 0}.caption h2{font-size:28px;font-weight:550;letter-spacing:-.7px;margin:0}.tag{font-size:11px;letter-spacing:2px;color:#85c6dc;text-transform:uppercase}.stats{color:#aabfce;font-size:12px;letter-spacing:.5px}.error{position:absolute;inset:0;display:grid;place-items:center;background:#101923;z-index:5}#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#a4c8dc;z-index:1}

<body><main id="scene" aria-label="Interactive 3D fleet preview"></main><div id="loading">Preparing fleet atelier…</div>
<header><div><h1>STELLAR / FLEET ATELIER</h1><p>CC0 hulls · custom fittings · game-ready fleet</p></div><div class="controls"><select id="models" aria-label="Fleet design"></select><button id="export">Export GLB</button><button id="rotate" aria-pressed="true">Auto orbit</button></div></header><a href="index.html" style="position:absolute;top:128px;left:32px;z-index:2;color:#b1e0f5;min-height:44px;padding:8px 0">← Return to game</a>
<div class="caption"><div><span class="tag" id="family">FLEET DESIGN</span><h2 id="name">Loading fleet…</h2><p id="description"></p></div><div class="stats" id="stats"></div></div>
<script type="module">
import * as THREE from 'three';import {preloadFleetAssets} from './enhancements/asset-library.js';await preloadFleetAssets();import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {originalEnvironment} from './enhancements/environment.js';
import {createUnit,FLEET_DESIGNS,UNIT_DEFS} from './enhancements/units.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);scene.add(new THREE.HemisphereLight(0xe1efff,0x344653,3));scene.add(new THREE.AmbientLight(0xc4d9e9,.6));
const key=new THREE.DirectionalLight(0xffe6c8,4);key.position.set(5,9,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});key.shadow.bias=-.0005;scene.add(key);
const rim=new THREE.DirectionalLight(0x8abbd5,2);rim.position.set(-6,5,-4);scene.add(rim);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('scene').append(renderer.domElement);
scene.environment=originalEnvironment(renderer).texture;
const floor=new THREE.Mesh(new THREE.CircleGeometry(80,96),new THREE.MeshStandardMaterial({color:0x172633,roughness:.95,metalness:.08}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.25;floor.receiveShadow=true;scene.add(floor);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);camera.position.set(2.9,2.2,3.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.minDistance=2.5;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*.48;controls.enablePan=false;
let model=null;const selector=document.getElementById('models');for(const [type,spec] of Object.entries(FLEET_DESIGNS)){const o=document.createElement('option');o.value=type;o.textContent=spec.label;selector.append(o);}
function dispose(root){const gs=new Set(),ms=new Set();root.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)for(const m of Array.isArray(o.material)?o.material:[o.material])ms.add(m)});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());scene.remove(root);}
function frameModel(){if(!model)return;const sphere=new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());const vfov=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)/camera.zoom),hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);const distance=sphere.radius/Math.sin(Math.min(vfov,hfov)/2)*1.12;controls.target.copy(sphere.center);camera.position.copy(sphere.center).add(new THREE.Vector3(2.9,2.2,3.8).normalize().multiplyScalar(distance));controls.update();}
function select(type){if(model)dispose(model);model=createUnit(type);scene.add(model);frameModel();selector.value=type;const spec=FLEET_DESIGNS[type];document.getElementById('name').textContent=spec.label;document.getElementById('description').textContent=spec.description;document.getElementById('family').textContent=spec.source;let triangles=0,meshes=0;model.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;}});document.getElementById('stats').textContent=Math.round(triangles).toLocaleString()+' triangles · '+meshes+' meshes';window.modelReady=true;}
selector.onchange=()=>select(selector.value);
document.getElementById('export').onclick=async()=>{const copy=model.clone(true);copy.rotation.set(0,0,0);copy.traverse(o=>{o.userData={source:typeof o.userData.source==='string'?o.userData.source:'Stellar Clash fleet adaptation'};});const data=await new GLTFExporter().parseAsync(copy,{binary:true});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download=selector.value+'-stellar-design.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);};
let auto=true;document.getElementById('rotate').onclick=()=>{auto=!auto;document.getElementById('rotate').setAttribute('aria-pressed',String(auto));};controls.addEventListener('start',()=>{auto=false;document.getElementById('rotate').setAttribute('aria-pressed','false');});const motion=matchMedia('(prefers-reduced-motion:reduce)');let t=0;const clock=new THREE.Clock();
function resize(){camera.aspect=innerWidth/innerHeight;camera.zoom=innerWidth<700?.65:1;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frameModel();}addEventListener('resize',resize);resize();select('interceptor');document.getElementById('loading').remove();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(document.hidden)return;if(!motion.matches)t+=dt;if(model?.userData.exhaust)model.userData.exhaust.scale.y=motion.matches?1:1+.12*Math.sin(t*8);controls.autoRotate=auto&&!motion.matches;controls.autoRotateSpeed=.5;controls.update();renderer.render(scene,camera);});
window.gallery={select,model:()=>model,renderer,camera,controls};
</script></body></html>
