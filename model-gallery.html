<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stellar Clash — Building Atelier</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101923;color:#e7eef3;font:14px/1.5 system-ui,Arial,sans-serif}#scene{position:absolute;inset:0}canvas{display:block}header{position:absolute;top:24px;left:32px;right:32px;z-index:2;display:flex;justify-content:space-between;gap:24px;pointer-events:none}header>*{pointer-events:auto}h1{font-size:20px;letter-spacing:2px;font-weight:600;margin:0}header p{margin:4px 0 0;color:#a5b6c6;letter-spacing:.5px;font-size:13px}.controls{background:#111e2aeb;border:1px solid #3b5264;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;max-width:65vw}select,button{border:1px solid #526b7e;background:#253949;color:#edf7ff;border-radius:6px;font:inherit;padding:10px;min-height:44px}select{max-width:260px}button{cursor:pointer}button:hover{background:#355365}button:focus-visible,select:focus-visible{outline:2px solid #a6e6fd;outline-offset:3px}.caption{position:absolute;bottom:28px;left:32px;right:32px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:24px;pointer-events:none}.caption p{max-width:480px;color:#aebdca;font-size:14px;margin:8px 0 0}.caption h2{font-size:28px;font-weight:550;letter-spacing:-.7px;margin:0}.tag{font-size:11px;letter-spacing:2px;color:#85c6dc;text-transform:uppercase}.stats{color:#aabfce;font-size:12px;letter-spacing:.5px}.error{position:absolute;inset:0;display:grid;place-items:center;background:#101923;z-index:5}#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#a4c8dc;z-index:1}

<body><main id="scene" aria-label="Interactive 3D building preview"></main><div id="loading">Preparing model atelier…</div>
<header><div><h1>STELLAR / BUILDING ATELIER</h1><p>Custom architecture · original geometry · PBR materials</p></div><div class="controls"><select id="models" aria-label="Building model"></select><select id="tier" aria-label="Building level"><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option></select><button id="rotate" aria-pressed="true">Auto orbit</button></div></header>
<div class="caption"><div><span class="tag" id="family">COMMAND ARCHITECTURE</span><h2 id="name">Command Center</h2><p id="description"></p></div><div class="stats" id="stats"></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {originalEnvironment} from './enhancements/environment.js';
import {createBuildingModel,MODEL_TYPES,MODEL_NAMES,applyLevel} from './enhancements/buildings.js';
const descriptions={command:'Layered armored command decks, blue-glass observation windows and a rotating communications dish.',extractor:'Reinforced crystal containment tower with a suspended ore crystal and rotating stabilization rings.',reactor:'Toroidal fusion chamber surrounded by copper coil packs, coolant lines and ceramic service armor.',solar:'Four individually framed photovoltaic panels on a slow-tracking double-wing support.',drill:'Industrial gantry with guide rods, safety striping and a modeled four-turn helical drill.',storage:'Armored vault with corner clamps, a segmented access shutter and illuminated roof hatch.',wall:'Beveled modular bulkhead with recessed armor plates, machined top vents and safety stripes.',turret:'Twin optical barrels on a articulated armored mount, with ceramic side shields and recessed lenses.',pulse:'Curved antenna dish, feed struts and optical emitter on an azimuth-tracking mast.',missile:'Six launch tubes in an elevating rack, each containing a modeled missile nose.',cannon:'Heavy plasma bore with heat-exchanger jackets, copper coolant pipes and a recessed emitter.',tesla:'Eight copper induction rings, ceramic insulators and three animated electrical corona arcs.',sniper:'Forked railgun with twin conductive rails, individual coil packs and a floating central emitter.',shield:'Tripod-supported gimbal and translucent hexagonal energy field.',barracks:'Armored training hangar with a segmented shutter, roof ventilation and parked interceptor.',starport:'Octagonal landing deck, ceramic gantries, dock control tower and a miniature shuttle.',habitat:'Two residential decks with inset windows, an entrance canopy and a glazed roof atrium.'};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);scene.add(new THREE.HemisphereLight(0xe1efff,0x344653,3));scene.add(new THREE.AmbientLight(0xc4d9e9,.6));
const key=new THREE.DirectionalLight(0xffe6c8,4);key.position.set(5,9,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});key.shadow.bias=-.0005;scene.add(key);
const rim=new THREE.DirectionalLight(0x8abbd5,2);rim.position.set(-6,5,-4);scene.add(rim);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('scene').append(renderer.domElement);
scene.environment=originalEnvironment(renderer).texture;
const floor=new THREE.Mesh(new THREE.CircleGeometry(80,96),new THREE.MeshStandardMaterial({color:0x172633,roughness:.95,metalness:.08}));floor.rotation.x=-Math.PI/2;floor.position.y=-.17;floor.receiveShadow=true;scene.add(floor);
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(2.58,2.58,.16,80),new THREE.MeshStandardMaterial({color:0x304555,metalness:.42,roughness:.64}));pedestal.position.y=-.085;pedestal.receiveShadow=true;scene.add(pedestal);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);camera.position.set(5.6,4.1,6.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.05,0);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*.48;controls.enablePan=false;
let model=null;const selector=document.getElementById('models');for(const type of MODEL_TYPES){const o=document.createElement('option');o.value=type;o.textContent=MODEL_NAMES[type];selector.append(o);}
function dispose(root){const gs=new Set(),ms=new Set();root.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)ms.add(o.material)});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());scene.remove(root);}
function select(type){if(model)dispose(model);model=createBuildingModel(type);applyLevel(model,Number(document.getElementById('tier').value));scene.add(model);selector.value=type;document.getElementById('name').textContent=MODEL_NAMES[type];document.getElementById('description').textContent=descriptions[type]||'Original fleet infrastructure with modular armor and upgrade fittings.';const family=['command','habitat','wall','builder'].includes(type)?'Infrastructure':['barracks','starport','camp'].includes(type)?'Fleet facilities':['extractor','reactor','solar','drill','storage'].includes(type)?'Resource systems':'Defense systems';document.getElementById('family').textContent=family;let triangles=0,meshes=0;model.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;}});document.getElementById('stats').textContent=Math.round(triangles).toLocaleString()+' triangles · '+meshes+' mesh batches';window.modelReady=true;}
selector.onchange=()=>select(selector.value);document.getElementById('tier').onchange=()=>select(selector.value);let auto=true;document.getElementById('rotate').onclick=()=>{auto=!auto;document.getElementById('rotate').setAttribute('aria-pressed',String(auto));};controls.addEventListener('start',()=>{auto=false;document.getElementById('rotate').setAttribute('aria-pressed','false');});const motion=matchMedia('(prefers-reduced-motion:reduce)');let t=0;const clock=new THREE.Clock();
function resize(){camera.aspect=innerWidth/innerHeight;camera.zoom=innerWidth<700?.65:1;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',resize);resize();select('command');document.getElementById('loading').remove();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(document.hidden)return;if(!motion.matches)t+=dt;if(model?.userData.update)model.userData.update(t);controls.autoRotate=auto&&!motion.matches;controls.autoRotateSpeed=.5;controls.update();renderer.render(scene,camera);});
window.gallery={select,model:()=>model,renderer,camera,controls};
</script></body></html>
